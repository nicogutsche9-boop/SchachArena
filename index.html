<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SchachArena – Multiplayer</title>
<style>
:root{--bg:#0f1117;--card:#191d27;--text:#f4f5f7;--muted:#aab0bd;--accent:#7c5cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#242a3a,#0f1117 55%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}
main{width:min(940px,94vw);margin:auto;padding:28px 0 40px}.brand{text-align:center;margin-bottom:22px}.brand h1{font-size:clamp(30px,7vw,52px);margin:8px 0}.brand p{color:var(--muted);margin:0}
.card{background:#191d27eF;border:1px solid #ffffff12;border-radius:20px;padding:20px;box-shadow:0 18px 60px #0007;backdrop-filter:blur(10px)}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.controls input{flex:1;min-width:180px}
button,input{border:0;border-radius:12px;padding:12px 15px;font:inherit}input{background:#10131a;color:white;border:1px solid #ffffff18}button{background:#7c5cff;color:white;font-weight:800;cursor:pointer}button.secondary{background:#303747}button:active{transform:scale(.98)}
#game{display:none}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.pill{background:#252b38;padding:9px 12px;border-radius:999px;color:#dce0e8}
#board{width:min(88vw,680px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);margin:auto;border:5px solid #080a0e;border-radius:10px;overflow:hidden}
.sq{display:flex;align-items:center;justify-content:center;font-size:clamp(29px,9vw,68px);cursor:pointer;user-select:none}.light{background:#f0d9b5}.dark{background:#b58863}.sel{outline:5px solid #f7d154;outline-offset:-5px}.last{box-shadow:inset 0 0 0 5px #8ac66b}
.info{text-align:center;color:var(--muted);font-size:14px;margin-top:15px}.hidden{display:none!important}
.actions{display:flex;justify-content:center;gap:8px;margin-top:15px;flex-wrap:wrap}
</style>
</head>
<body>
<main>
<section id="home" class="card">
<div class="brand"><div style="font-size:38px">♟️</div><h1>SchachArena</h1><p>Einfach. Schnell. Multiplayer.</p></div>
<div class="controls">
<button onclick="createRoom()">Spiel erstellen</button>
<input id="code" placeholder="Raum-Code eingeben">
<button class="secondary" onclick="joinRoom()">Beitreten</button>
</div>
<p class="info">Teile deinen Raum-Code mit deinem Mitspieler. Weiß beginnt.</p>
</section>

<section id="game" class="card">
<div class="bar"><button class="secondary" onclick="location.reload()">← Lobby</button><span id="who" class="pill">Verbinde…</span><span id="turn" class="pill"></span></div>
<div id="board"></div>
<div class="actions"><button class="secondary" onclick="resetGame()">Neues Spiel</button><button onclick="shareCode()">Code teilen</button></div>
<p id="roomInfo" class="info"></p>
</section>
</main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const glyph={r:"♜",n:"♞",b:"♝",q:"♛",k:"♚",p:"♟",R:"♖",N:"♘",B:"♗",Q:"♕",K:"♔"};
let b=[],turn="w",sel=null,last=null,peer=null,conn=null,me=null,room="";
function initial(){b=["rnbqkbnr","pppppppp","........","........","........","........","PPPPPPPP","RNBQKBNR"].map(x=>[...x]);turn="w";sel=null;last=null;draw()}
function col(p){return p&&p!="."?(p===p.toUpperCase()?"w":"b"):null}
function draw(){let e=document.getElementById("board");e.innerHTML="";for(let r=0;r<8;r++)for(let c=0;c<8;c++){let s=document.createElement("div");s.className="sq "+((r+c)%2?"dark":"light");if(sel&&sel[0]==r&&sel[1]==c)s.classList.add("sel");if(last&&((last[0]==r&&last[1]==c)||(last[2]==r&&last[3]==c)))s.classList.add("last");s.textContent=glyph[b[r][c]]||"";s.onclick=()=>click(r,c);e.appendChild(s)}document.getElementById("turn").textContent="Am Zug: "+(turn=="w"?"Weiß":"Schwarz")}
function path(r1,c1,r2,c2){let dr=Math.sign(r2-r1),dc=Math.sign(c2-c1),r=r1+dr,c=c1+dc;while(r!=r2||c!=c2){if(b[r][c]!=".")return false;r+=dr;c+=dc}return true}
function valid(r1,c1,r2,c2){let p=b[r1][c1],t=b[r2][c2],dr=r2-r1,dc=c2-c1,a=Math.abs(dr),d=Math.abs(dc);if(!p||p=="."||col(p)!=turn||col(t)==turn)return false;let x=p.toLowerCase();if(x=="p"){let dir=turn=="w"?-1:1,start=turn=="w"?6:1;return(dc==0&&t=="."&&(dr==dir||(r1==start&&dr==2*dir&&b[r1+dir][c1]==".")))||(d==1&&dr==dir&&t!=".")}if(x=="n")return(a==2&&d==1)||(a==1&&d==2);if(x=="b")return a==d&&path(r1,c1,r2,c2);if(x=="r")return(a==0||d==0)&&path(r1,c1,r2,c2);if(x=="q")return(a==d||a==0||d==0)&&path(r1,c1,r2,c2);if(x=="k")return Math.max(a,d)==1}
function click(r,c){if(me&&me!=turn)return;if(!sel){if(col(b[r][c])==turn)sel=[r,c]}else if(col(b[r][c])==turn)sel=[r,c];else if(valid(sel[0],sel[1],r,c)){let m=[...sel,r,c];move(...m);if(conn)conn.send({t:"move",m});sel=null}else sel=null;draw()}
function move(r1,c1,r2,c2){let p=b[r1][c1];b[r2][c2]=p;b[r1][c1]=".";if(p=="P"&&r2==0)b[r2][c2]="Q";if(p=="p"&&r2==7)b[r2][c2]="q";last=[r1,c1,r2,c2];turn=turn=="w"?"b":"w";draw()}
function show(){document.getElementById("home").style.display="none";document.getElementById("game").style.display="block"}
function createRoom(){room=Math.random().toString(36).slice(2,8).toUpperCase();peer=new Peer("schach-"+room);me="w";show();document.getElementById("who").textContent="Du: Weiß";document.getElementById("roomInfo").textContent="Raum-Code: "+room+" – teile ihn mit deinem Gegner";peer.on("connection",c=>{conn=c;c.on("open",()=>c.send({t:"state",b,turn}));setup()});peer.on("error",()=>alert("Raum konnte nicht erstellt werden."))}
function joinRoom(){room=document.getElementById("code").value.trim().toUpperCase();if(!room)return alert("Bitte Raum-Code eingeben.");peer=new Peer();me="b";show();document.getElementById("who").textContent="Du: Schwarz";document.getElementById("roomInfo").textContent="Raum: "+room;peer.on("open",()=>{conn=peer.connect("schach-"+room);setup()});peer.on("error",()=>alert("Raum nicht gefunden."))}
function setup(){conn.on("open",()=>{});conn.on("data",m=>{if(m.t=="move")move(...m.m);if(m.t=="reset")initial();if(m.t=="state"){b=m.b;turn=m.turn;draw()}})}
function resetGame(){initial();if(conn)conn.send({t:"reset"})}
function shareCode(){let text="Komm mit mir ins Schachspiel! Raum-Code: "+room;navigator.share?navigator.share({text}):navigator.clipboard?.writeText(text).then(()=>alert("Einladung kopiert!"))}
initial();
</script>
</body></html>
