<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SchachArena</title>
<style>
:root{--bg:#0c0f14;--card:#171b23;--card2:#202632;--text:#f5f7fb;--muted:#9da6b5;--accent:#7c5cff;--gold:#f5c451}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#30384b 0,#11151d 45%,#0c0f14 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{width:min(900px,94vw);margin:auto;padding:24px 0 40px}
.card{background:#171b23ee;border:1px solid #ffffff12;border-radius:20px;padding:20px;box-shadow:0 20px 60px #0008}
.brand{text-align:center;padding:10px 0 20px}.logo{font-size:48px}.brand h1{font-size:clamp(34px,9vw,54px);margin:4px 0}.brand p{color:var(--muted);margin:0}
.controls{display:flex;gap:10px;flex-wrap:wrap}.controls>*{flex:1;min-width:150px}
button,input{border:0;border-radius:12px;padding:13px 15px;font:inherit}
button{background:var(--accent);color:white;font-weight:800;cursor:pointer}button.secondary{background:var(--card2)}button:active{transform:scale(.98)}
input{background:#0f131a;color:white;border:1px solid #ffffff16;outline:none}
.ranking{margin:16px 0;background:#10141b;padding:15px;border-radius:15px}.rankrow,.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.pill{background:var(--card2);padding:8px 11px;border-radius:999px;font-size:14px}
#game{display:none}.topbar{margin-bottom:14px}.turn{font-weight:800}
.boardwrap{width:min(92vw,700px);margin:auto}
#board{width:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1/1;border:5px solid #080a0d;border-radius:10px;overflow:hidden;box-shadow:0 18px 35px #0008}
.sq{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:clamp(27px,9vw,66px);line-height:1;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;position:relative}
.light{background:#f0d9b5}.dark{background:#b58863}.selected{outline:5px solid #f5d15b;outline-offset:-5px}.last{box-shadow:inset 0 0 0 5px #75b957}
.coords{position:absolute;font-size:9px;opacity:.45;bottom:3px;right:4px;color:#111}
.help{color:var(--muted);text-align:center;font-size:13px;line-height:1.5;margin:15px 0 0}
.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:15px}
.hide{display:none!important}
</style>
</head>
<body>
<main>
<section id="lobby" class="card">
<div class="brand"><div class="logo">♟</div><h1>SchachArena</h1><p>Multiplayer-Schach mit Ranking</p></div>
<div class="ranking">
<div class="rankrow"><b>🏆 Dein Ranking</b><span id="rating" class="pill">1000 Punkte</span></div>
<p id="stats" class="help" style="margin-bottom:0">0 Siege · 0 Niederlagen</p>
</div>
<div class="controls">
<button onclick="createRoom()">Spiel erstellen</button>
<input id="roomInput" maxlength="12" placeholder="Raum-Code">
<button class="secondary" onclick="joinRoom()">Beitreten</button>
</div>
<p class="help">Erstelle einen Raum und teile den Code mit deinem Gegner. Weiß beginnt.</p>
</section>

<section id="game" class="card">
<div class="topbar">
<button class="secondary" onclick="backLobby()">← Lobby</button>
<span id="color" class="pill">Du: –</span>
<span id="turn" class="pill turn">Am Zug: Weiß</span>
</div>
<div class="boardwrap"><div id="board"></div></div>
<p id="roomInfo" class="help"></p>
<div class="actions">
<button class="secondary" onclick="copyRoom()">📋 Code kopieren</button>
<button onclick="newGame()">🔄 Neues Spiel</button>
</div>
<p class="help">Einfache Schachregeln: Rochade und En-passant sind nicht enthalten.</p>
</section>
</main>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const PIECES={r:"♜",n:"♞",b:"♝",q:"♛",k:"♚",p:"♟",R:"♖",N:"♘",B:"♗",Q:"♕",K:"♔",P:"♙"};
let board=[],turn="w",selected=null,lastMove=null,peer=null,conn=null,myColor=null,room="",gameOver=false,localResultDone=false;
let rating=+localStorage.getItem("sa_rating")||1000,wins=+localStorage.getItem("sa_wins")||0,losses=+localStorage.getItem("sa_losses")||0;

function rank(){return rating>=1400?"Gold":rating>=1200?"Silber":rating>=1000?"Bronze":"Anfänger"}
function updateRanking(){document.getElementById("rating").textContent=rating+" Punkte · "+rank();document.getElementById("stats").textContent=wins+" Siege · "+losses+" Niederlagen"}
function saveRanking(){localStorage.setItem("sa_rating",rating);localStorage.setItem("sa_wins",wins);localStorage.setItem("sa_losses",losses);updateRanking()}
function score(win){if(localResultDone)return;localResultDone=true;if(win){rating+=25;wins++;alert("🎉 Gewonnen! +25 Punkte")}else{rating=Math.max(0,rating-15);losses++;alert("😕 Verloren. -15 Punkte")}saveRanking()}
function fresh(){board=["rnbqkbnr","pppppppp","........","........","........","........","PPPPPPPP","RNBQKBNR"].map(x=>[...x]);turn="w";selected=null;lastMove=null;gameOver=false;localResultDone=false;draw()}
function colorOf(p){return p&&p!="."?(p===p.toUpperCase()?"w":"b"):null}
function clearPath(r1,c1,r2,c2){let dr=Math.sign(r2-r1),dc=Math.sign(c2-c1),r=r1+dr,c=c1+dc;while(r!==r2||c!==c2){if(board[r][c]!==".")return false;r+=dr;c+=dc}return true}
function legal(r1,c1,r2,c2){
 const p=board[r1][c1],t=board[r2][c2];if(!p||p==="."||colorOf(p)!==turn||colorOf(t)===turn)return false;
 const dr=r2-r1,dc=c2-c1,a=Math.abs(dr),d=Math.abs(dc),type=p.toLowerCase();
 if(type==="p"){const dir=turn==="w"?-1:1,start=turn==="w"?6:1;return(dc===0&&t==="."&&(dr===dir||(r1===start&&dr===2*dir&&board[r1+dir][c1]===".")))||(d===1&&dr===dir&&t!==".")}
 if(type==="n")return(a===2&&d===1)||(a===1&&d===2);
 if(type==="b")return a===d&&clearPath(r1,c1,r2,c2);
 if(type==="r")return(a===0||d===0)&&clearPath(r1,c1,r2,c2);
 if(type==="q")return(a===d||a===0||d===0)&&clearPath(r1,c1,r2,c2);
 if(type==="k")return Math.max(a,d)===1;
 return false
}
function draw(){
 const e=document.getElementById("board");e.innerHTML="";
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const s=document.createElement("div");s.className="sq "+((r+c)%2?"dark":"light");
  if(selected&&selected[0]===r&&selected[1]===c)s.classList.add("selected");
  if(lastMove&&((lastMove[0]===r&&lastMove[1]===c)||(lastMove[2]===r&&lastMove[3]===c)))s.classList.add("last");
  s.textContent=PIECES[board[r][c]]||"";s.onclick=()=>tap(r,c);e.appendChild(s)
 }
 document.getElementById("turn").textContent="Am Zug: "+(turn==="w"?"Weiß":"Schwarz")
}
function tap(r,c){
 if(gameOver||(myColor&&myColor!==turn))return;
 const p=board[r][c];
 if(!selected){if(colorOf(p)===turn)selected=[r,c]}
 else if(colorOf(p)===turn)selected=[r,c];
 else if(legal(selected[0],selected[1],r,c)){const m=[selected[0],selected[1],r,c];applyMove(...m,true);selected=null}
 else selected=null;
 draw()
}
function applyMove(r1,c1,r2,c2,send){
 const moving=board[r1][c1],captured=board[r2][c2];
 board[r2][c2]=moving;board[r1][c1]=".";
 if(moving==="P"&&r2===0)board[r2][c2]="Q";
 if(moving==="p"&&r2===7)board[r2][c2]="q";
 lastMove=[r1,c1,r2,c2];
 if(captured==="K"||captured==="k"){
  gameOver=true;draw();
  const winner=colorOf(captured)==="w"?"b":"w";score(winner===myColor);
  if(send&&conn)conn.send({type:"gameover",winner});
  return
 }
 turn=turn==="w"?"b":"w";draw();
 if(send&&conn)conn.send({type:"move",m:[r1,c1,r2,c2]})
}
function createRoom(){
 room=Math.random().toString(36).slice(2,8).toUpperCase();myColor="w";showGame();
 peer=new Peer("schacharena-"+room);
 peer.on("open",()=>{roomInfo("Raum-Code: "+room+" · Warte auf Gegner…")});
 peer.on("connection",c=>{conn=c;setupConnection();c.on("open",()=>c.send({type:"state",b:board,turn:turn}))});
 peer.on("error",()=>roomInfo("Verbindung konnte nicht hergestellt werden."))
}
function joinRoom(){
 room=document.getElementById("roomInput").value.trim().toUpperCase();if(!room)return alert("Bitte einen Raum-Code eingeben.");
 myColor="b";showGame();peer=new Peer();
 peer.on("open",()=>{conn=peer.connect("schacharena-"+room);setupConnection()});
 peer.on("error",()=>roomInfo("Raum nicht gefunden oder nicht mehr verfügbar."))
}
function setupConnection(){
 document.getElementById("color").textContent="Du: "+(myColor==="w"?"Weiß":"Schwarz");
 conn.on("open",()=>roomInfo("Verbunden · Raum-Code: "+room));
 conn.on("data",m=>{
  if(m.type==="state"){board=m.b;turn=m.turn;draw()}
  if(m.type==="move")applyMove(...m.m,false);
  if(m.type==="gameover"){gameOver=true;draw();score(m.winner===myColor)}
  if(m.type==="reset"){fresh()}
 })
}
function showGame(){document.getElementById("lobby").classList.add("hide");document.getElementById("game").style.display="block";document.getElementById("color").textContent="Du: "+(myColor==="w"?"Weiß":"Schwarz");fresh()}
function roomInfo(t){document.getElementById("roomInfo").textContent=t}
function copyRoom(){navigator.clipboard?.writeText(room);alert("Raum-Code kopiert: "+room)}
function newGame(){fresh();if(conn)conn.send({type:"reset"})}
function backLobby(){location.reload()}
updateRanking();fresh();
</script>
</body>
</html>
